name: PHP Composer Legacy (PHP 5.4)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    # Docs: https://github.com/shivammathur/setup-php
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        # Downgrade to PHP 5.4
        php-version: '5.4'
        # Keep extensions minimal for compatibility
        extensions: mbstring, json, curl
        coverage: false # xdebug support is often complex/unstable on old versions

    - name: Get composer cache directory
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: Cache composer dependencies
      uses: actions/cache@v3
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-composer-

    - name: Install Composer dependencies
      # Note: For PHP 5.4, you may need an older Composer client.
      run: composer install --no-progress --prefer-dist --optimize-autoloader

    - name: Run test suite
      run: composer test
